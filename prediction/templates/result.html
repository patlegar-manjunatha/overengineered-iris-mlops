<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prediction Result</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="result-page">

  <h2 class="result-title">Prediction Result</h2>

  <section class="result-cards">

    <div class="card {% if prediction == 'Setosa' %}active{% else %}dim{% endif %}">
      <img src="/static/images/setosa.jpg" alt="Setosa">
      <h3>Setosa</h3>
    </div>

    <div class="card {% if prediction == 'Versicolor' %}active{% else %}dim{% endif %}">
      <img src="/static/images/versicolor.jpg" alt="Versicolor">
      <h3>Versicolor</h3>
    </div>

    <div class="card {% if prediction == 'Virginica' %}active{% else %}dim{% endif %}">
      <img src="/static/images/virginica.jpg" alt="Virginica">
      <h3>Virginica</h3>
    </div>

  </section>

  <p class="final-output">
    Predicted Class:
    <span class="highlight">{{ prediction }}</span>
  </p>

  <!-- NEW BUTTON -->
  <a href="/predict-form" class="retry-link">
    <button class="secondary-btn">TRY ANOTHER PREDICTION</button>
  </a>
</body>
</html>
