name: MLOps End-to-End Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx
          # Install both requirements to run integration tests
          pip install -r prediction/requirements.txt
          pip install -r training/requirements.txt

      - name: Run Unit Tests
        run: |
          # If this fails, the pipeline STOPS here.
          pytest tests/

  build-and-push:
    needs: test-code  
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Prediction Image
        uses: docker/build-push-action@v4
        with:
          context: ./prediction
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/overengineered-iris-mlops-prediction:latest

      - name: Build & Push Training Image
        uses: docker/build-push-action@v4
        with:
          context: ./training
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/overengineered-iris-mlops-training:latest